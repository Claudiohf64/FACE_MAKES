<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTuber con Python y MediaPipe (Alta Fidelidad)</title>
    <style>
        body { margin: 0; background: #333; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #status {
            position: fixed; top: 10px; left: 10px; padding: 5px 10px;
            background: rgba(255, 0, 0, 0.7); color: white;
            font-family: Arial, sans-serif; border-radius: 5px; z-index: 100;
        }
        #status.connected { background: rgba(0, 255, 0, 0.7); }
        #webcam-feed {
            position: fixed; top: 10px; right: 10px;
            width: 320px; height: 240px;
            border: 2px solid white; background: #000; z-index: 101;
        }
    </style>
</head>

<body>
    <div id="status">Conectando...</div>
    <div id="canvas-container"></div>
    <img id="webcam-feed" src="">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/kalidokit@1.1.5/dist/kalidokit.umd.js"></script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "@pixiv/three-vrm": "/static/three-vrm.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin } from '@pixiv/three-vrm';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 4. Configuración de la Escena 3D ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x333333);
        const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 10);
        camera.position.set(0, 1.3, 1.2);
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(0.5, 1, 1).normalize();
        scene.add(directionalLight);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.3, 0);
        controls.update();
        const clock = new THREE.Clock();
        let currentVrm = null;
        let blendshapeTargets = null; // Almacén para los datos de Kalidokit

        // Función de suavizado (Interpolación Lineal)
        const lerp = (start, end, alpha) => {
            return start * (1 - alpha) + end * alpha;
        };

        // --- 5. Cargar el Avatar .vrm ---
        const loader = new GLTFLoader();
        loader.register((parser) => {
            return new VRMLoaderPlugin(parser);
        });
        
        loader.load(
            '/static/changli.vrm', 
            (gltf) => {
                const vrm = gltf.userData.vrm;
                console.log("¡Avatar cargado!", vrm);
                currentVrm = vrm;
                scene.add(vrm.scene); 
            },
            (progress) => console.log('Cargando modelo...', 100 * (progress.loaded / progress.total), '%'),
            (error) => console.error("¡ERROR AL CARGAR EL MODELO!", error)
        );

        // --- 6. Conexión WebSocket ---
        const statusElement = document.getElementById('status');
        const socket = io('http://localhost:5002'); 

        socket.on('connect', () => {
            console.log('Conectado al servidor de Python!');
            statusElement.textContent = 'Conectado';
            statusElement.classList.add('connected');
        });

        socket.on('disconnect', () => {
            console.log('Desconectado del servidor');
            statusElement.textContent = 'Desconectado';
            statusElement.classList.remove('connected');
        });

        // --- 7. Recibir y Guardar Datos ---
        socket.on('update_data', (data) => {
            document.getElementById('webcam-feed').src = 'data:image/jpeg;base64,' + data.frame;
            const landmarks = data.mesh; 
            if (!landmarks) return;

            blendshapeTargets = window.Kalidokit.Face.solve(landmarks, {
                runtime: 'mediapipe', 
                outputAngles: false 
            });
        });

        // --- 8. Bucle de Animación (¡MAPEADO CORREGIDO!) ---
        function animate() {
            requestAnimationFrame(animate);

            if (currentVrm && blendshapeTargets) {
                const expressionManager = currentVrm.expressionManager;
                
                // --- 1. OJOS (Guiño) ---
                let blinkLeftTarget = 1.0 - (blendshapeTargets.eye.l || 0);
                let currentBlinkLeft = expressionManager.getValue('blinkLeft') || 0;
                expressionManager.setValue('blinkLeft', lerp(currentBlinkLeft, blinkLeftTarget, 0.3));

                let blinkRightTarget = 1.0 - (blendshapeTargets.eye.r || 0);
                let currentBlinkRight = expressionManager.getValue('blinkRight') || 0;
                expressionManager.setValue('blinkRight', lerp(currentBlinkRight, blinkRightTarget, 0.3));

                // --- 2. BOCA (CON GANANCIA + NOMBRES CORRECTOS) ---
                
                const BOCA_GAIN = 3.0; // ¡Puedes ajustar este valor!

                // Kalidokit 'A' -> VRM 'aa'
                let mouthAATarget = Math.min(1.0, (blendshapeTargets.mouth.shape.A || 0) * BOCA_GAIN); 
                let currentMouthAA = expressionManager.getValue('aa') || 0;
                expressionManager.setValue('aa', lerp(currentMouthAA, mouthAATarget, 0.3));

                // Kalidokit 'I' -> VRM 'ih'
                let mouthIHTarget = (blendshapeTargets.mouth.shape.I || 0);
                let currentMouthIH = expressionManager.getValue('ih') || 0;
                expressionManager.setValue('ih', lerp(currentMouthIH, mouthIHTarget, 0.3));
                
                // Kalidokit 'U' -> VRM 'ou'
                let mouthOUTarget = (blendshapeTargets.mouth.shape.U || 0);
                let currentMouthOU = expressionManager.getValue('ou') || 0;
                expressionManager.setValue('ou', lerp(currentMouthOU, mouthOUTarget, 0.3));

                // Kalidokit 'E' -> VRM 'ee'
                let mouthEETarget = (blendshapeTargets.mouth.shape.E || 0);
                let currentMouthEE = expressionManager.getValue('ee') || 0;
                expressionManager.setValue('ee', lerp(currentMouthEE, mouthEETarget, 0.3));
                
                // Kalidokit 'O' -> VRM 'oh'
                let mouthOHTarget = (blendshapeTargets.mouth.shape.O || 0);
                let currentMouthOH = expressionManager.getValue('oh') || 0;
                expressionManager.setValue('oh', lerp(currentMouthOH, mouthOHTarget, 0.3));

                // --- 3. SONRISA ---
                // (Seguimos asumiendo que 'joy' es el nombre, ¡es el estándar!)
                let smileTarget = blendshapeTargets.mouth.smile || 0;
                let currentSmile = expressionManager.getValue('joy') || 0;
                expressionManager.setValue('joy', lerp(currentSmile, smileTarget, 0.3));

                // Aplicamos los cambios (API v0.0)
                expressionManager.update();
            }
            
            // Actualiza físicas (pelo) y dibuja la escena
            if (currentVrm) {
                currentVrm.update(clock.getDelta());
            }
            renderer.render(scene, camera);
        }

        animate(); // Iniciar el bucle de renderizado

    </script>
</body>
</html>
