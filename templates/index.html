<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTuber Full-Body con Python y MediaPipe</title>
    <style>
        body { 
            margin: 0; 
            background: #333; 
            overflow: hidden; 
            font-family: Arial, sans-serif;
            color: white;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* indicador de estado */
        #status {
            position: fixed; top: 10px; left: 10px; padding: 5px 10px;
            background: rgba(255, 0, 0, 0.7); color: white;
            border-radius: 5px; z-index: 100;
        }
        #status.connected { background: rgba(0, 255, 0, 0.7); }
        
        /* video de la webcam (16:9) */
        #webcam-feed {
            position: fixed; 
            bottom: 20px;
            right: 20px;
            width: 320px; 
            height: 180px; /* 16:9 */
            border: 2px solid white; 
            background: #000; 
            z-index: 101;
            object-fit: cover;
            border-radius: 5px;
        }
        
        /* selector de avatar */
        #model-selector-container {
            position: fixed;
            top: 10px;
            left: 100px;
            z-index: 100;
            background: rgba(0,0,0,0.5);
            padding: 5px;
            border-radius: 5px;
        }
        #model-selector-container label {
            margin-right: 5px;
        }
        #model-selector {
            background: #555;
            color: white;
            border: 1px solid #777;
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <div id="status">Conectando...</div>
    
    <div id="model-selector-container">
        <label for="model-selector">Avatar:</label>
        <select id="model-selector"></select>
    </div>
    
    <div id="canvas-container"></div>
    <img id="webcam-feed" src="">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/kalidokit@1.1.0/dist/kalidokit.umd.js"></script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "@pixiv/three-vrm": "/static/three-vrm.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin } from '@pixiv/three-vrm';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1 configuracion de la escena 3d
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x333333);
        const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 10);
        camera.position.set(0, 1.3, 1.2);
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(0.5, 1, 1).normalize();
        scene.add(directionalLight);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.3, 0);
        controls.update();
        const clock = new THREE.Clock();

        // 2 variables globales de estado
        let currentVrm = null;
        let solvedFace = null;
        let solvedPose = null;
        let solvedLeftHand = null;
        let solvedRightHand = null;
        let currentGesture = "nada"; // gesto por defecto

        // 3 utilidades (vectores, quaternions, lerp)
        const euler = new THREE.Euler();
        const targetQuaternion = new THREE.Quaternion();
        const headEuler = new THREE.Euler();
        const headQuaternion = new THREE.Quaternion();

        const lerp = (start, end, alpha) => {
            return start * (1 - alpha) + end * alpha;
        };
        
        // 4 carga del avatar vrm
        const loader = new GLTFLoader();
        loader.register((parser) => {
            return new VRMLoaderPlugin(parser);
        });

        // 5 lista de avatares vrm
        // modifica esto con tus modelos en la carpeta /static
        const models = [
            { name: "Persona (Defecto)", path: "/static/persona.vrm" },
            // { name: "Avatar 2", path: "/static/avatar2.vrm" },
        ];

        // 6 logica del selector de avatar
        const selector = document.getElementById('model-selector');
        
        function populateModelSelector() {
            models.forEach((model, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = model.name;
                selector.appendChild(option);
            });
        }
        
        selector.addEventListener('change', (e) => {
            const modelIndex = e.target.value;
            loadModel(models[modelIndex].path);
        });

        function loadModel(modelPath) {
            // si ya hay un modelo, lo quitamos de la escena
            if (currentVrm) {
                scene.remove(currentVrm.scene);
                currentVrm = null;
            }

            console.log(`cargando modelo: ${modelPath}`);
            loader.load(
                modelPath,
                (gltf) => {
                    const vrm = gltf.userData.vrm;
                    console.log("avatar cargado");
                    currentVrm = vrm;
                    vrm.scene.rotation.set(0, 0, 0); 
                    scene.add(vrm.scene);
                },
                null, // progreso omitido
                (error) => console.error("ERROR AL CARGAR EL MODELO!", error)
            );
        }

        // 7 conexion websocket
        const statusElement = document.getElementById('status');
        const socket = io('http://localhost:5002');

        socket.on('connect', () => {
            console.log('conectado al servidor de python');
            statusElement.textContent = 'conectado';
            statusElement.classList.add('connected');
        });

        // 8 recibir y resolver todos los datos
        socket.on('update_data', (data) => {
            document.getElementById('webcam-feed').src = 'data:image/jpeg;base64,' + data.frame;

            const face_landmarks = data.face_mesh;
            const pose_world_landmarks = data.pose_world_mesh; 
            const left_hand_landmarks = data.left_hand_mesh;
            const right_hand_landmarks = data.right_hand_mesh;
            currentGesture = data.gesture; // "abierta", "cerrada", "like", o "nada"

            // resolver cara (para expresiones y cabeza)
            try {
                if (face_landmarks && face_landmarks.length > 0) {
                    solvedFace = window.Kalidokit.Face.solve(face_landmarks, { runtime: 'mediapipe' });
                } else {
                    solvedFace = null;
                }
            } catch (e) {
                solvedFace = null;
            }
            
            // resolver pose
            if (pose_world_landmarks && pose_world_landmarks.length > 0) { 
                solvedPose = window.Kalidokit.Pose.solve(pose_world_landmarks, { 
                    runtime: 'mediapipe',
                    enableLegs: false,
                    useUpperBodyOnly: true,
                    flip: true // clave por el flip en python
                });
            } else {
                solvedPose = null;
            }

            // resolver manos (para dedos)
            if (left_hand_landmarks && left_hand_landmarks.length > 0) {
                solvedLeftHand = window.Kalidokit.Hand.solve(left_hand_landmarks, 'Left');
            } else {
                solvedLeftHand = null;
            }
            if (right_hand_landmarks && right_hand_landmarks.length > 0) {
                solvedRightHand = window.Kalidokit.Hand.solve(right_hand_landmarks, 'Right');
            } else {
                solvedRightHand = null;
            }
        });

        // 9 funciones de rigging (animacion del avatar)

        // mapeo especial para el pulgar
        const THUMB_BONE_MAP = {
            "LeftThumbProximal": "leftThumbMetacarpal",
            "LeftThumbIntermediate": "leftThumbProximal",
            "RightThumbProximal": "rightThumbMetacarpal",
            "RightThumbIntermediate": "rightThumbProximal"
        };

        // funcion para aplicar rotaciones de cuerpo y caderas
        const rigBodyPose = (vrm, poseData) => {
            if (!vrm || !poseData) return;
            const rig = vrm.humanoid;
            const alpha = 0.3; // suavizado

            for (const [kalidokitName, data] of Object.entries(poseData)) {
                
                // ignorar cabeza, torso y brazos
                if (kalidokitName === "Head" || kalidokitName === "Neck" || kalidokitName === "Chest" || kalidokitName === "Spine" ||
                    kalidokitName === "LeftUpperArm" || kalidokitName === "LeftLowerArm" || kalidokitName === "LeftHand" ||
                    kalidokitName === "RightUpperArm" || kalidokitName === "RightLowerArm" || kalidokitName === "RightHand"
                ) {
                    continue;
                }
                
                const vrmBoneName = window.Kalidokit.Utils.poseMap[kalidokitName];
                const bone = rig.getNormalizedBoneNode(vrmBoneName);
                if (!bone) continue; 

                let finalQuaternion = null;
                if (data && data.isQuaternion) {
                    finalQuaternion = data;
                }
                else if (data && data.rotation && data.rotation.isQuaternion) {
                    finalQuaternion = data;
                }
                
                if (bone && finalQuaternion) {
                    bone.quaternion.slerp(finalQuaternion, alpha);
                }
            }
        };

        // funcion para aplicar rotaciones de manos (dedos)
        const rigHandPose = (vrm, handData) => {
            if (!vrm || !handData) return;
            const rig = vrm.humanoid;
            const alpha = 0.3;

            for (const [kalidokitName, rotation] of Object.entries(handData)) {
                let vrmBoneName = kalidokitName.charAt(0).toLowerCase() + kalidokitName.slice(1);

                const mappedName = THUMB_BONE_MAP[kalidokitName];
                if (mappedName) vrmBoneName = mappedName;
                
                const bone = rig.getNormalizedBoneNode(vrmBoneName);

                if (bone && rotation &&
                    typeof rotation.x === 'number' &&
                    typeof rotation.y === 'number' &&
                    typeof rotation.z === 'number'
                ) {
                    euler.set(rotation.x, rotation.y, rotation.z, 'YXZ');
                    targetQuaternion.setFromEuler(euler);
                    bone.quaternion.slerp(targetQuaternion, alpha);
                }
            }
        };

        // 10 bucle de animacion
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (currentVrm) {
                const expressionManager = currentVrm.expressionManager;
                const rig = currentVrm.humanoid;
                
                // parte a: mover la cara (expresiones y cabeza/torso)
                if (solvedFace) {
                    // 1 expresiones faciales
                    let blinkLeftTarget = 1.0 - (solvedFace.eye.l || 0);
                    expressionManager.setValue('blinkLeft', lerp(expressionManager.getValue('blinkLeft') || 0, blinkLeftTarget, 0.3));
                    let blinkRightTarget = 1.0 - (solvedFace.eye.r || 0);
                    expressionManager.setValue('blinkRight', lerp(expressionManager.getValue('blinkRight') || 0, blinkRightTarget, 0.3));
                    
                    const BOCA_GAIN = 3.0;
                    let mouthAATarget = Math.min(1.0, (solvedFace.mouth.shape.A || 0) * BOCA_GAIN);
                    expressionManager.setValue('aa', lerp(expressionManager.getValue('aa') || 0, mouthAATarget, 0.3));
                    
                    expressionManager.setValue('ih', lerp(expressionManager.getValue('ih') || 0, solvedFace.mouth.shape.I || 0, 0.3));
                    expressionManager.setValue('ou', lerp(expressionManager.getValue('ou') || 0, solvedFace.mouth.shape.U || 0, 0.3));
                    expressionManager.setValue('ee', lerp(expressionManager.getValue('ee') || 0, solvedFace.mouth.shape.E || 0, 0.3));
                    expressionManager.setValue('oh', lerp(expressionManager.getValue('oh') || 0, solvedFace.mouth.shape.O || 0, 0.3));
                    
                    // mover cabeza, cuello y torso en cadena
                    const headBone = rig.getNormalizedBoneNode('head');
                    const neckBone = rig.getNormalizedBoneNode('neck');
                    const chestBone = rig.getNormalizedBoneNode('chest');
                    const spineBone = rig.getNormalizedBoneNode('spine');
                    const alpha = 0.3; 

                    if (headBone && solvedFace.head) {
                        const headRot = solvedFace.head;
                        headEuler.set(headRot.x, headRot.y, headRot.z, 'YXZ');
                        headQuaternion.setFromEuler(headEuler);

                        // 1 mover la cabeza
                        headBone.quaternion.slerp(headQuaternion, alpha);

                        // 2 mover el cuello
                        if (neckBone) {
                            headEuler.set(headRot.x * 0.5, headRot.y * 0.5, headRot.z * 0.5, 'YXZ');
                            targetQuaternion.setFromEuler(headEuler);
                            neckBone.quaternion.slerp(targetQuaternion, alpha);
                        }
                        
                        // 3 mover el pecho/espina
                        if (chestBone) {
                            headEuler.set(headRot.x * 0.3, headRot.y * 0.2, headRot.z * 0.3, 'YXZ');
                            targetQuaternion.setFromEuler(headEuler);
                            chestBone.quaternion.slerp(targetQuaternion, alpha);
                        }
                        if (spineBone) {
                            headEuler.set(headRot.x * 0.2, headRot.y * 0.1, headRot.z * 0.2, 'YXZ');
                            targetQuaternion.setFromEuler(headEuler);
                            spineBone.quaternion.slerp(targetQuaternion, alpha);
                        }
                    }
                }

                // parte b: mover el cuerpo (piernas/caderas)
                if (solvedPose) {
                    rigBodyPose(currentVrm, solvedPose);
                }

                // parte c: mover las manos (dedos)
                if (solvedLeftHand) {
                    rigHandPose(currentVrm, solvedLeftHand); 
                }
                if (solvedRightHand) {
                    rigHandPose(currentVrm, solvedRightHand);
                }
                
                // parte d: forzar pose de brazos (cactus "l")
                const armAlpha = 0.1; // suavizado para los brazos
                const leftUpperArm = rig.getNormalizedBoneNode('leftUpperArm');
                const rightUpperArm = rig.getNormalizedBoneNode('rightUpperArm');
                const leftLowerArm = rig.getNormalizedBoneNode('leftLowerArm');
                const rightLowerArm = rig.getNormalizedBoneNode('rightLowerArm');
                
                // hombros
                if (leftUpperArm) {
                    targetQuaternion.setFromEuler(euler.set(0, 0, Math.PI / 2.5)); 
                    leftUpperArm.quaternion.slerp(targetQuaternion, armAlpha);
                }
                if (rightUpperArm) {
                    targetQuaternion.setFromEuler(euler.set(0, 0, -Math.PI / 2.5));
                    rightUpperArm.quaternion.slerp(targetQuaternion, armAlpha);
                }
                
                // codos
                if (leftLowerArm) {
                    targetQuaternion.setFromEuler(euler.set(0, -Math.PI / 2, 0));
                    leftLowerArm.quaternion.slerp(targetQuaternion, armAlpha);
                }
                if (rightLowerArm) {
                    targetQuaternion.setFromEuler(euler.set(0, Math.PI / 2, 0));
                    rightLowerArm.quaternion.slerp(targetQuaternion, armAlpha);
                }
                
                // parte e: reaccionar al gesto de la cnn
                
                // gesto: cerrada -> expresion: angry (enojado)
                if (currentGesture === "cerrada") { // actualizado de "fist" a "cerrada"
                    expressionManager.setValue('angry', lerp(expressionManager.getValue('angry') || 0, 1.0, 0.1));
                } else {
                    expressionManager.setValue('angry', lerp(expressionManager.getValue('angry') || 0, 0.0, 0.2));
                }
                
                // gesto "like" usa "fun" (divertido/ojos curvos)
                let smileTarget = (solvedFace && solvedFace.mouth.smile) ? solvedFace.mouth.smile : 0;
                // 'joy' (sonrisa) es controlado por la cara
                expressionManager.setValue('joy', lerp(expressionManager.getValue('joy') || 0, smileTarget, 0.2)); 

                if (currentGesture === "like") {
                    // 'fun' (ojos curvos) es controlado por el gesto 'like'
                    expressionManager.setValue('fun', lerp(expressionManager.getValue('fun') || 0, 1.0, 0.1));
                } else {
                    expressionManager.setValue('fun', lerp(expressionManager.getValue('fun') || 0, 0.0, 0.2));
                }

                // gesto: abierta -> expresion: surprised (sorprendido)
                if (currentGesture === "abierta") { // actualizado de "open" a "abierta"
                    expressionManager.setValue('surprised', lerp(expressionManager.getValue('surprised') || 0, 1.0, 0.1));
                } else {
                    expressionManager.setValue('surprised', lerp(expressionManager.getValue('surprised') || 0, 0.0, 0.2));
                }
                
                // actualizamos todas las expresiones
                expressionManager.update();
                
                // actualizamos las fisicas (pelo, ropa)
                currentVrm.update(delta);
            }
            
            // renderizar la escena
            renderer.render(scene, camera);
        }

        // 11 iniciar la aplicacion
        populateModelSelector(); // llena el menu desplegable
        loadModel(models[0].path); // carga el primer modelo de la lista
        animate(); // inicia el bucle de renderizado

    </script>
</body>
</html>
