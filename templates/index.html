<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTuber con Python y MediaPipe (Alta Fidelidad)</title>
    <style>
        body { margin: 0; background: #333; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #status {
            position: fixed; top: 10px; left: 10px; padding: 5px 10px;
            background: rgba(255, 0, 0, 0.7); color: white;
            font-family: Arial, sans-serif; border-radius: 5px; z-index: 100;
        }
        #status.connected { background: rgba(0, 255, 0, 0.7); }
        #webcam-feed {
            position: fixed; top: 10px; right: 10px;
            width: 320px; height: 240px;
            border: 2px solid white; background: #000; z-index: 101;
        }
    </style>
</head>

<body>
    <div id="status">Conectando...</div>
    <div id="canvas-container"></div>
    <img id="webcam-feed" src="">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/kalidokit@1.1.5/dist/kalidokit.umd.js"></script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "@pixiv/three-vrm": "/static/three-vrm.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin } from '@pixiv/three-vrm';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x333333);
        const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 10);
        camera.position.set(0, 1.3, 1.2);
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(0.5, 1, 1).normalize();
        scene.add(directionalLight);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.3, 0);
        controls.update();
        const clock = new THREE.Clock();
        let currentVrm = null;
        let blendshapeTargets = null;
        const lerp = (start, end, alpha) => {
            return start * (1 - alpha) + end * alpha;
        };

        const loader = new GLTFLoader();
        loader.register((parser) => {
            return new VRMLoaderPlugin(parser);
        });
        
        loader.load(
            '/static/changli.vrm',
            (gltf) => {
                const vrm = gltf.userData.vrm;
                console.log("¡Avatar cargado!", vrm);
                currentVrm = vrm;
                scene.add(vrm.scene); 
            },
            (progress) => console.log('Cargando modelo...', 100 * (progress.loaded / progress.total), '%'),
            (error) => console.error("¡ERROR AL CARGAR EL MODELO!", error)
        );

        const statusElement = document.getElementById('status');
        const socket = io('http://localhost:5002'); 

        socket.on('connect', () => {
            console.log('Conectado al servidor de Python!');
            statusElement.textContent = 'Conectado';
            statusElement.classList.add('connected');
        });

        socket.on('disconnect', () => {
            console.log('Desconectado del servidor');
            statusElement.textContent = 'Desconectado';
            statusElement.classList.remove('connected');
        });

        socket.on('update_data', (data) => {
            document.getElementById('webcam-feed').src = 'data:image/jpeg;base64,' + data.frame;
            const landmarks = data.mesh; 
            if (!landmarks) return;

            blendshapeTargets = window.Kalidokit.Face.solve(landmarks, {
                runtime: 'mediapipe', 
                outputAngles: false 
            });
        });

        function animate() {
            requestAnimationFrame(animate);

            if (currentVrm && blendshapeTargets) {
                const expressionManager = currentVrm.expressionManager;
                
                let blinkLeftTarget = 1.0 - (blendshapeTargets.eye.l || 0);
                let currentBlinkLeft = expressionManager.getValue('blinkLeft') || 0;
                expressionManager.setValue('blinkLeft', lerp(currentBlinkLeft, blinkLeftTarget, 0.3));

                let blinkRightTarget = 1.0 - (blendshapeTargets.eye.r || 0);
                let currentBlinkRight = expressionManager.getValue('blinkRight') || 0;
                expressionManager.setValue('blinkRight', lerp(currentBlinkRight, blinkRightTarget, 0.3));

                let mouthOpenTarget = (blendshapeTargets.mouth.shape.A || 0) * 1.5; 
                let currentMouthOpen = expressionManager.getValue('a') || 0;
                expressionManager.setValue('a', lerp(currentMouthOpen, mouthOpenTarget, 0.3));

                let smileTarget = blendshapeTargets.mouth.smile || 0;
                let currentSmile = expressionManager.getValue('joy') || 0;
                expressionManager.setValue('joy', lerp(currentSmile, smileTarget, 0.3));

                let mouthITarget = blendshapeTargets.mouth.shape.I || 0;
                let currentMouthI = expressionManager.getValue('i') || 0;
                expressionManager.setValue('i', lerp(currentMouthI, mouthITarget, 0.3));
                
                let mouthUTarget = blendshapeTargets.mouth.shape.U || 0;
                let currentMouthU = expressionManager.getValue('u') || 0;
                expressionManager.setValue('u', lerp(currentMouthU, mouthUTarget, 0.3));

                let mouthETarget = blendshapeTargets.mouth.shape.E || 0;
                let currentMouthE = expressionManager.getValue('e') || 0;
                expressionManager.setValue('e', lerp(currentMouthE, mouthETarget, 0.3));
                
                let mouthOTarget = blendshapeTargets.mouth.shape.O || 0;
                let currentMouthO = expressionManager.getValue('o') || 0;
                expressionManager.setValue('o', lerp(currentMouthO, mouthOTarget, 0.3));

                expressionManager.update();
            }
            
            if (currentVrm) {
                currentVrm.update(clock.getDelta());
            }
            renderer.render(scene, camera);
        }

        animate();

    </script>
</body>
</html>
